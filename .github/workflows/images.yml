name: Demo images
on:
  workflow_dispatch:
  push:
    tags: ["images-v*"]
  pull_request:
    paths:
      - guest/**
      - scripts/**
      - versions.env
      - .github/workflows/images.yml
permissions:
  contents: read
jobs:
  image:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v7
      - name: Install image builder
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends qemu-system-x86 qemu-system-arm qemu-utils qemu-efi-aarch64 cloud-image-utils e2fsprogs
          if [ -e /dev/kvm ]; then sudo chmod a+rw /dev/kvm; fi
      - name: Bake, smoke-test, verify registry persistence and OS reset
        run: python3 scripts/build-image.py --arch "${{ matrix.arch }}" --release "$GITHUB_REF_NAME"
      - name: Preserve build logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: image-logs-${{ matrix.arch }}
          path: build/ubuntu-registry-${{ matrix.arch }}/*.log
      - uses: actions/upload-artifact@v7
        with:
          name: ig-demo-${{ matrix.arch }}
          path: dist/ubuntu-registry/*
          compression-level: 0
      - name: Publish image assets
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Public, so the launcher can download without credentials; never "latest",
          # which stays with launcher releases.
          gh release view "$GITHUB_REF_NAME" || gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" \
            --notes "Demo VM images" --latest=false || gh release view "$GITHUB_REF_NAME"
          find dist/ubuntu-registry -type f ! -name 'manifest-*' -print0 | xargs -0 gh release upload "$GITHUB_REF_NAME" --clobber
          # The launcher only considers an architecture once its manifest exists.
          gh release upload "$GITHUB_REF_NAME" "dist/ubuntu-registry/manifest-${{ matrix.arch }}.json" --clobber
    permissions:
      contents: write
