alertmanager:
  enabled: false
kube-state-metrics:
  enabled: false
prometheus-pushgateway:
  enabled: false
prometheus-node-exporter:
  enabled: true
  fullnameOverride: node-exporter
  resources:
    requests:
      cpu: 10m
      memory: 16Mi
    limits:
      memory: 64Mi
configmapReload:
  prometheus:
    enabled: false
server:
  fullnameOverride: prometheus
  global:
    scrape_interval: 30s
    evaluation_interval: 1m
  # Each start is a fresh cluster, so history only needs to cover one session.
  retention: 2d
  retentionSize: 512MB
  persistentVolume:
    enabled: false
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      memory: 512Mi
